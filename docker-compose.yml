services:
  db:
    image: postgres:15
    container_name: bibliotheque-db
    environment:
      POSTGRES_DB: bibliotheque
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bibliotheque"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./bibliotheque-backend
    container_name: bibliotheque-backend
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bibliotheque
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./bibliotheque-frontend
    container_name: bibliotheque-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres-data: