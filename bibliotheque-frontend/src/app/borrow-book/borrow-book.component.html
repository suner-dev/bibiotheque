<div class="container-fluid py-4">
  <div class="section-title animate-fade-in-up">
    <span class="section-title-icon">📚</span>
    <span>Livres disponibles à l'emprunt</span>
  </div>

  <!-- Loading -->
  <div *ngIf="!books.length" class="text-center py-5 animate-fade-in">
    <div class="loader-spinner mb-3"></div>
    <p class="text-muted">Chargement des livres...</p>
  </div>

  <!-- Liste vide -->
  <div *ngIf="books.length === 0" class="empty-state animate-fade-in-up">
    <div class="empty-icon">📚</div>
    <h4>Aucun livre disponible</h4>
    <p class="text-muted">Aucun livre n'est actuellement disponible à l'emprunt.</p>
  </div>

  <!-- Tableau des livres -->
  <div *ngIf="books.length > 0" class="glass-card overflow-hidden animate-fade-in-up delay-1">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th><i class="bi bi-upc me-1"></i> ID</th>
            <th><i class="bi bi-book me-1"></i> Nom</th>
            <th><i class="bi bi-person me-1"></i> Auteur</th>
            <th><i class="bi bi-tag me-1"></i> Genre</th>
            <th><i class="bi bi-collection me-1"></i> Exemplaires</th>
            <th class="text-center"><i class="bi bi-gear me-1"></i> Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let book of books; let i = index"
              class="animate-fade-in-up"
              [style.animation-delay]="(i * 0.05) + 's'">
            <td><span class="badge bg-secondary">{{ book.bookId }}</span></td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <span class="book-icon">📖</span>
                <span class="fw-semibold">{{ book.bookName }}</span>
              </div>
            </td>
            <td>{{ book.bookAuthor }}</td>
            <td><span class="genre-badge">{{ book.bookGenre }}</span></td>
            <td>
              <span class="copies-count" [class.copies-none]="book.noOfCopies === 0">
                {{ book.noOfCopies }}
              </span>
            </td>
            <td class="text-center">
              <button (click)="borrowBook(book.bookId)"
                      class="btn btn-3d btn-3d-success btn-3d-sm">
                <i class="bi bi-bookmark-plus me-1"></i> Emprunter
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
