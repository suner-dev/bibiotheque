<div class="form-wrapper animate-fade-in">
  <div class="glass-card form-card">
    <div class="section-title">
      <span class="section-title-icon">✏️</span>
      <span>Modifier l'utilisateur</span>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-person me-1"></i> Nom complet
        </label>
        <input type="text" class="form-control" id="name"
               [(ngModel)]="user.name" name="name"
               placeholder="Entrez le nom complet" required>
      </div>

      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-at me-1"></i> Nom d'utilisateur
        </label>
        <input type="text" class="form-control" id="username"
               [(ngModel)]="user.username" name="username"
               placeholder="Entrez le nom d'utilisateur" required>
      </div>

      <div class="form-group mb-4">
        <label class="form-label">
          <i class="bi bi-shield me-1"></i> Rôle
        </label>
        <select class="form-select" id="role"
                [(ngModel)]="user.role" name="role" required>
          <option value="" disabled selected>Sélectionner un rôle</option>
          <option *ngFor="let role of roles" [value]="role">{{role}}</option>
        </select>
      </div>

      <button type="submit" class="btn btn-3d btn-3d-success w-100">
        <i class="bi bi-check-circle me-2"></i> Enregistrer les modifications
      </button>
    </form>
  </div>
</div>
