<div class="card card-shadow h-100">
  <div class="card-body">
    <h3 class="card-title text-center mb-4">Créer une réservation</h3>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i> {{ errorMessage }}
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="alert alert-success" role="alert">
      <i class="bi bi-check-circle-fill"></i> {{ successMessage }}
    </div>

    <!-- Indicateur de chargement des listes -->
    <div *ngIf="!books.length || !users.length" class="text-center py-3">
      <span class="text-muted"><i class="bi bi-arrow-repeat spinner-border spinner-border-sm me-2"></i>Chargement des données...</span>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off" #reservationForm="ngForm">
      <!-- Livre -->
      <div class="mb-3">
        <label class="form-label"><strong>Livre</strong></label>
        <select class="form-select"
                [(ngModel)]="request.livreId"
                name="livreId"
                required>
          <option value="" disabled selected>-- Sélectionner un livre --</option>
          <option *ngFor="let book of books" [value]="book.bookId">
            {{ book.bookName }} — {{ book.bookAuthor }} ({{ book.noOfCopies }} exemplaire(s))
          </option>
        </select>
      </div>

      <!-- Adhérent -->
      <div class="mb-3">
        <label class="form-label"><strong>Adhérent</strong></label>
        <select class="form-select"
                [(ngModel)]="request.adherentId"
                name="adherentId"
                required>
          <option value="" disabled selected>-- Sélectionner un adhérent --</option>
          <option *ngFor="let user of users" [value]="user.userId">
            {{ user.name }} — {{ user.username }}
          </option>
        </select>
      </div>

      <!-- Bouton de soumission -->
      <button type="submit"
              class="btn btn-success w-100"
              [disabled]="!canSubmit || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        {{ isSubmitting ? 'Création...' : 'Créer la réservation' }}
      </button>
    </form>
  </div>
</div>
