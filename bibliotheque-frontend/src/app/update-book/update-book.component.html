<div class="form-wrapper animate-fade-in">
  <div class="glass-card form-card">
    <div class="section-title">
      <span class="section-title-icon">✏️</span>
      <span>Modifier le livre</span>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-book me-1"></i> Nom du livre
        </label>
        <input type="text" class="form-control" id="bookName"
               [(ngModel)]="book.bookName" name="bookName"
               placeholder="Entrez le nom du livre" required>
      </div>

      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-person me-1"></i> Auteur
        </label>
        <input type="text" class="form-control" id="bookAuthor"
               [(ngModel)]="book.bookAuthor" name="bookAuthor"
               placeholder="Entrez le nom de l'auteur" required>
      </div>

      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-tag me-1"></i> Genre
        </label>
        <input type="text" class="form-control" id="bookGenre"
               [(ngModel)]="book.bookGenre" name="bookGenre"
               placeholder="Entrez le genre" required>
      </div>

      <div class="form-group mb-4">
        <label class="form-label">
          <i class="bi bi-collection me-1"></i> Nombre d'exemplaires
        </label>
        <input type="number" class="form-control" id="noOfCopies"
               [(ngModel)]="book.noOfCopies" name="noOfCopies"
               placeholder="0" min="0" required>
      </div>

      <button type="submit" class="btn btn-3d btn-3d-success w-100">
        <i class="bi bi-check-circle me-2"></i> Enregistrer les modifications
      </button>
    </form>
  </div>
</div>
